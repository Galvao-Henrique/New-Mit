<?xml version="1.0" encoding="UTF-8"?>
<!--
  Boi provisório do mapa de cortes (geometria de mitata-alimentos/src/components/ilustracoes/silhuetas.ts).
  Segue o contrato de docs/contrato-mapa-boi.md: será substituído pelo desenho feito no Claude Design.
  As bordas externas das regiões foram aproximadas do corpo (o recorte pelo contorno dá o mesmo desenho).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <defs>
    <linearGradient id="boi-corpo" gradientUnits="userSpaceOnUse" x1="60" y1="44" x2="120" y2="192">
      <stop offset="0" stop-color="#1B3C91"/>
      <stop offset="1" stop-color="#0B1633"/>
    </linearGradient>
    <linearGradient id="boi-brilho" gradientUnits="userSpaceOnUse" x1="0" y1="46" x2="0" y2="104">
      <stop offset="0" stop-color="#F4EDE1" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#F4EDE1" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="boi-orgao" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#F6E7C4"/>
      <stop offset="0.55" stop-color="#DDBF80"/>
      <stop offset="1" stop-color="#C9A45C"/>
    </radialGradient>
    <radialGradient id="boi-sombra">
      <stop offset="0" stop-color="#0B1633" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#0B1633" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="boi-recorte">
      <path d="M 62 52 C 76 50 88 49 100 50 C 140 50 180 51 210 50 C 232 49 250 46 262 47 C 268 47 272 49 275 52 C 282 60 284 82 281 102 C 280 110 278 116 276 120 C 273 130 274 140 277 148 C 273 158 272 172 273 184 L 275 190 L 262 190 L 262 184 C 262 170 262 160 259 150 C 257 140 252 131 245 127 C 218 135 172 138 134 132 C 131 146 128 166 129 184 L 130 190 L 117 190 L 117 184 C 117 166 116 150 112 138 C 104 131 96 122 92 110 C 85 105 77 99 68 96 C 60 94 50 95 42 95 C 35 95 30 92 28 87 C 26 81 29 74 34 68 C 39 62 45 57 52 54 C 55 53 58 52 62 52 Z"/>
    </clipPath>
  </defs>

  <!-- Sombra no chão, rabo e patas do lado de lá (fora das peças) -->
  <ellipse cx="196" cy="190" rx="104" ry="6" fill="url(#boi-sombra)"/>
  <path d="M 276 54 C 285 64 287 90 285 118 C 285 124 286 128 288 132" fill="none" stroke="#14244D" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M 288 130 C 292 134 291 141 286 142 C 282 142 282 136 284 132 Z" fill="#0B1633"/>
  <path d="M 146 128 C 146 148 145 168 146 184 L 147 190 L 136 190 L 136 184 C 136 166 137 148 140 130 Z M 244 124 C 250 136 252 150 251 162 C 250 172 250 180 251 186 L 252 190 L 240 190 L 240 184 C 240 172 241 160 240 150 C 238 140 234 132 230 128 Z" fill="#0B1633"/>

  <!-- Contorno: cabeça, pescoço e patas -->
  <path d="M 62 52 C 76 50 88 49 100 50 C 140 50 180 51 210 50 C 232 49 250 46 262 47 C 268 47 272 49 275 52 C 282 60 284 82 281 102 C 280 110 278 116 276 120 C 273 130 274 140 277 148 C 273 158 272 172 273 184 L 275 190 L 262 190 L 262 184 C 262 170 262 160 259 150 C 257 140 252 131 245 127 C 218 135 172 138 134 132 C 131 146 128 166 129 184 L 130 190 L 117 190 L 117 184 C 117 166 116 150 112 138 C 104 131 96 122 92 110 C 85 105 77 99 68 96 C 60 94 50 95 42 95 C 35 95 30 92 28 87 C 26 81 29 74 34 68 C 39 62 45 57 52 54 C 55 53 58 52 62 52 Z" fill="url(#boi-corpo)"/>

  <!-- Cavidade sob os quartos: aparece quando uma peça se ergue ou escurece -->
  <path d="M 67 42 L 178.3 42 L 182 176 L 100 176 L 94 120 L 88 110 L 72 100 Z M 178.3 42 L 290 42 L 290 176 L 182 176 Z" clip-path="url(#boi-recorte)" fill="#060C1E"/>

  <g id="peca-dianteiro">
    <path d="M 67 42 L 178.3 42 L 182 176 L 100 176 L 94 120 L 88 110 L 72 100 Z" clip-path="url(#boi-recorte)" fill="url(#boi-corpo)"/>
    <path d="M 67 42 L 178.3 42 L 182 176 L 100 176 L 94 120 L 88 110 L 72 100 Z" clip-path="url(#boi-recorte)" fill="url(#boi-brilho)" stroke="#C9A45C" stroke-width="1.1" stroke-linejoin="round"/>
  </g>

  <g id="peca-traseiro">
    <path d="M 178.3 42 L 290 42 L 290 176 L 182 176 Z" clip-path="url(#boi-recorte)" fill="url(#boi-corpo)"/>
    <path d="M 178.3 42 L 290 42 L 290 176 L 182 176 Z" clip-path="url(#boi-recorte)" fill="url(#boi-brilho)" stroke="#C9A45C" stroke-width="1.1" stroke-linejoin="round"/>
  </g>

  <g id="peca-pa">
    <path d="M 93.4 44 L 141.5 44 L 146 96 L 138 134 L 110 140 L 94 112 L 86 76 Z" clip-path="url(#boi-recorte)" fill="url(#boi-corpo)"/>
    <path d="M 93.4 44 L 141.5 44 L 146 96 L 138 134 L 110 140 L 94 112 L 86 76 Z" clip-path="url(#boi-recorte)" fill="url(#boi-brilho)" stroke="#C9A45C" stroke-width="1.1" stroke-linejoin="round"/>
  </g>

  <!-- Miúdos, em transparência na posição anatômica -->
  <g id="peca-rumen">
    <ellipse cx="206" cy="100" rx="22" ry="18" fill="url(#boi-orgao)" opacity="0.85" stroke="#F4EDE1" stroke-width="0.8" stroke-dasharray="2 1.6"/>
  </g>

  <g id="peca-figado">
    <ellipse cx="156" cy="104" rx="14" ry="9" fill="url(#boi-orgao)" opacity="0.85" stroke="#F4EDE1" stroke-width="0.8" stroke-dasharray="2 1.6"/>
  </g>

  <g id="peca-lingua">
    <ellipse cx="41.5" cy="89.5" rx="11.5" ry="3.2" fill="url(#boi-orgao)" opacity="0.85" stroke="#F4EDE1" stroke-width="0.8" stroke-dasharray="2 1.6"/>
  </g>

  <!-- Chifre, orelha e olho (fora das peças) -->
  <path d="M 58 52 C 56 46 56 41 59 37 C 61 42 63 47 66 51 Z" fill="#E4D3B0" stroke="#7A5C24" stroke-width="0.8" stroke-linejoin="round"/>
  <path d="M 68 53 C 74 46 82 43 88 44 C 86 50 78 55 70 57 Z" fill="#14244D" stroke="#C9A45C" stroke-width="0.8" stroke-linejoin="round"/>
  <circle cx="44" cy="70" r="1.7" fill="#F4EDE1"/>
</svg>
